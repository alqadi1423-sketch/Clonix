name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log || {
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 25 "What went wrong" build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            msg=$(grep -A 12 "What went wrong" build.log | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clone-app-apk
          path: app/build/outputs/apk/**/*.apk
